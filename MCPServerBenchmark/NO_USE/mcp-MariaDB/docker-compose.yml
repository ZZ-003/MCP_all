services:
  mariadb-server:
    image: mariadb:11
    container_name: mariadb
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_PASSWORD}
      MARIADB_DATABASE: demo
      MARIADB_USER: user
      MARIADB_PASSWORD: ${MARIADB_PASSWORD}
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "127.0.0.1", "-p${MARIADB_PASSWORD}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - custom_network

  mariadb-mcp:
    build: .
    container_name: mariadb-mcp
    # env_file: .env
    ports:
      - "${MCP_SERVER_PORT:-8000}:8000"
    networks:
      - custom_network
    environment:
      DB_HOST: mariadb-server
      DB_PORT: 3306
      DB_USER: user
      DB_PASSWORD: ${MARIADB_PASSWORD}
      DB_NAME: demo
      MCP_READ_ONLY: true
      MCP_MAX_POOL_SIZE: 10
      ALLOWED_ORIGINS: "*"
      ALLOWED_HOSTS: "*"
    depends_on:
      mariadb-server:
        condition: service_healthy


networks:
  custom_network:
    external: true
    name: ${NETWORK_NAME:-mcp-shared-network}