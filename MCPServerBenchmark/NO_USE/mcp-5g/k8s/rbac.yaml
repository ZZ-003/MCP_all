apiVersion: v1
kind: ServiceAccount
metadata:
  name: mcp5g
  namespace: mcp5g

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: mcp5g-readonly
rules:
  - apiGroups: [""]
    resources: [pods, services, configmaps, events, namespaces, nodes]
    verbs: [get, list, watch]
  - apiGroups: ["apps"]
    resources: [deployments, replicasets, statefulsets]
    verbs: [get, list, watch]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: mcp5g-readonly-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: mcp5g-readonly
subjects:
  - kind: ServiceAccount
    name: mcp5g
    namespace: mcp5g
