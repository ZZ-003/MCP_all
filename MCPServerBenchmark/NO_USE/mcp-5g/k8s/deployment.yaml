apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp5g
  namespace: mcp5g
  labels:
    app: mcp5g
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mcp5g
  template:
    metadata:
      labels:
        app: mcp5g
    spec:
      serviceAccountName: mcp5g
      containers:
        - name: mcp5g
          image: ghcr.io/your-org/mcp5g:latest
          imagePullPolicy: Always
          env:
            - name: DANGEROUSLY_OMIT_AUTH
              value: "false"
            # Inject the bearer token from a Kubernetes Secret
            - name: MCP_HTTP_BEARER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: mcp5g-auth
                  key: token
            - name: MCP_TRANSPORT
              value: "http"
            - name: MCP_HTTP_HOST
              value: "0.0.0.0"
            - name: MCP_HTTP_PORT
              value: "8000"
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20

---
apiVersion: v1
kind: Service
metadata:
  name: mcp5g
  namespace: mcp5g
  labels:
    app: mcp5g
spec:
  selector:
    app: mcp5g
  type: LoadBalancer
  ports:
    - name: http
      port: 8000
      targetPort: http

---
apiVersion: v1
kind: Secret
metadata:
  name: mcp5g-auth
  namespace: mcp5g
  labels:
    app: mcp5g
type: Opaque
stringData:
  # Replace with a long random value before applying in production
  token: "f56d1c78-f141-4740-bba9-4e9ab654433"
